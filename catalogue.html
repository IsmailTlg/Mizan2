<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue</title>
    <script src="js/catalogueScript.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <button><a href="index.html">Home</a></button>
            <input type="text" placeholder="Rechercher un element" id="searchBar">
            <button id="filterBtn">Filter</button>
        </nav>
    </header>
    <main>
        <button id="ajouterBtn">Ajouter un article</button>
        <section id="articlesArea">

        </section>
        <dialog id="filterDialogue">
            <h2>FILTER TAB</h2>
            <div>
                <select name="Tri" id="Tri">
                    <option value="">Tri</option>
                    <option value="titre">par Titre</option>
                    <option value="prix">par Prix</option>
                    <option value="date">par Date</option>
                </select>
                <select name="direction" id="direction">
                    <option value="">ascending</option>
                    <option value="-">descending</option>
                </select>
            </div>
            <select name="statut" id="statut">
                <option value="">Statut(All)</option>
                <option value="disponible">disponible</option>
                <option value="reserve">reserve</option>
                <option value="vendu">vendu</option>
            </select>
            <div>
                <button id="annulerBtn">Annuler</button>
                <button id="confirmerBtn">Filter</button>
            </div>
        </dialog>
        <dialog id="dialogForm">
            <form id="articleForm">
                <div class="inputErrGrp">
                    <input type="text" id="inputTitre" placeholder="Titre d'article">
                    <p id="errTitre" class="hide redTxt">nombre des caracteres entre 3 et 80</p>
                </div>
                <div class="inputErrGrp">
                    <input type="text" id="inputDescription" placeholder="Description d'article">
                    <p id="errDescription" class="hide redTxt">nombre des caracteres doit etre au moins que 10</p>
                </div>
                <div class="inputErrGrp">
                    <input type="number" id="inputPrix" placeholder="Prix en MAD">
                    <p id="errPrix" class="hide redTxt">prix doit etre positive</p>
                </div>
                <div class="inputErrGrp"> 
                    <select name="inputStatut" id="inputStatut">
                        <option value="">statut d'article</option>
                        <option value="disponible">disponible</option>
                        <option value="reserve">reserve</option>
                        <option value="vendu">vendu</option>
                    </select>
                    <p id="errStatut" class="hide redTxt">choisi un des 3 (disponible, reserve, vendu)</p>
                </div>
                <div>
                    <input type="date" id="inputDate">
                    <p id="errDate" class="hide redTxt">Invalid Date</p>
                </div>
                <div>
                    <button type="button" id="annulerBtnForm">Annuler</button>
                    <button type="submit" id="submitBtn">Ajouter</button>
                </div>
            </form>
        </dialog>
    </main>
</body>
</html>
